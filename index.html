    />
    <script>
      // Decide before first paint whether the GDS intro plays: home page, first visit this
      // session, motion allowed. Intro.tsx reads this flag.
      try {
        var seen = sessionStorage.getItem("gds-intro-seen");
        var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        document.documentElement.dataset.intro = location.pathname === "/" && !seen && !calm ? "on" : "off";
      } catch (e) {
        document.documentElement.dataset.intro = "off";
      }
    </script>
    <title>Giovanni De Stasio | Markets, trading systems and apps</title>
